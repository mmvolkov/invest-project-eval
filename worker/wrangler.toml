name = "invest-ai-proxy"
main = "ai-proxy.js"
compatibility_date = "2025-01-01"

[vars]
PROVIDER = "openai"                                  # openai | anthropic
BASE_URL = "https://ai.pro6000.cloudsmasters.ru/v1"  # OpenAI-совместимый endpoint (для Anthropic: https://api.anthropic.com)
MODEL = "qwen3.8-27b-nvfp4"
ALLOWED_ORIGINS = "https://mmvolkov.github.io"       # через запятую; * — разрешить всем

# Секреты задаются командами (ключ в файл не пишите):
#   wrangler secret put PROVIDER_KEY    # ключ вашей модели
#   wrangler secret put ACCESS_TOKEN    # (необязательно) токен доступа к прокси для фронтенда
