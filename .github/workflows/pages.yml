name: Tests & Deploy (GitHub Pages, Beget)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests (engine & templates)
        run: node --test tests/*.test.mjs

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Ключ модели (secrets.AI_API_KEY) в браузер не попадает: он нужен только прокси api/ai.php на Beget (job deploy-beget)
      - name: Inject AI config (vars.AI_PROVIDER / AI_BASE_URL / AI_MODEL / AI_LABEL, secrets.AI_BROWSER_API_KEY)
        env:
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}
          AI_BASE_URL: ${{ vars.AI_BASE_URL }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          AI_LABEL: ${{ vars.AI_LABEL }}
          AI_BROWSER_API_KEY: ${{ secrets.AI_BROWSER_API_KEY }}
        run: node scripts/inject-ai-config.mjs
      # Страницы из pages/ публикуются только на Beget (job deploy-ai-assistants), на GitHub Pages им делать нечего
      - name: Drop Beget-only pages
        run: rm -rf pages
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4

  # Зеркало на собственном хостинге (Beget) по FTP (FTPS у Beget рвёт TLS на канале данных): scout-argument.ru/invest-project-eval/
  # Секреты репозитория: BEGET_FTP_HOST, BEGET_FTP_USER, BEGET_FTP_PASSWORD.
  # Переменная BEGET_FTP_DIR (необязательно): каталог на сервере, по умолчанию корень FTP-аккаунта.
  deploy-beget:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: beget
      url: https://scout-argument.ru/invest-project-eval/
    steps:
      - uses: actions/checkout@v4
      - name: Inject AI config
        env:
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}
          AI_BASE_URL: ${{ vars.AI_BASE_URL }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          AI_LABEL: ${{ vars.AI_LABEL }}
          AI_BROWSER_API_KEY: ${{ secrets.AI_BROWSER_API_KEY }}
        run: node scripts/inject-ai-config.mjs
      # Зеркало на scout-argument.ru не должно индексироваться вместе с основным сайтом:
      # meta robots в index.html + заголовок X-Robots-Tag через .htaccess (только для копии на Beget).
      - name: Mark mirror as noindex
        run: |
          sed -i 's|<meta name="viewport"|<meta name="robots" content="noindex, nofollow, noarchive" />\n<meta name="viewport"|' index.html
          grep -q 'name="robots"' index.html
          printf '<IfModule mod_headers.c>\n  Header set X-Robots-Tag "noindex, nofollow, noarchive"\n</IfModule>\n' > .htaccess
      # Прокси ИИ api/ai.php читает ключ из api/config.php; файл создаётся здесь из секрета и в git не попадает
      - name: Write AI proxy config (secrets.AI_API_KEY, vars.AI_PROXY_BASE_URL / AI_MODEL / AI_PROXY_ORIGINS)
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_PROXY_BASE_URL: ${{ vars.AI_PROXY_BASE_URL }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          AI_PROXY_ORIGINS: ${{ vars.AI_PROXY_ORIGINS }}
        run: node scripts/write-ai-proxy-config.mjs
      - name: Upload to Beget (FTP)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.BEGET_FTP_HOST }}
          username: ${{ secrets.BEGET_FTP_USER }}
          password: ${{ secrets.BEGET_FTP_PASSWORD }}
          protocol: ftp
          server-dir: ${{ vars.BEGET_FTP_DIR || './' }}
          local-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            node_modules/**
            tests/**
            scripts/**
            worker/**
            pages/**
            package.json
            README.md
            **/.DS_Store

  # Страница-каталог AI-сервисов: scout-argument.ru/ai-assistants/ (исходник pages/ai-assistants/).
  # Включается переменной BEGET_AI_ASSISTANTS_DIR — путь к папке ai-assistants от корня FTP-аккаунта
  # (например, ai-assistants/ если домашняя папка аккаунта — public_html, или ./ для отдельного
  # FTP-аккаунта с домашней папкой /scout-argument.ru/public_html/ai-assistants). Если для страницы
  # заведён отдельный FTP-аккаунт, его логин и пароль — секреты BEGET_FTP_AI_USER и BEGET_FTP_AI_PASSWORD;
  # иначе используются BEGET_FTP_USER / BEGET_FTP_PASSWORD.
  deploy-ai-assistants:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.BEGET_AI_ASSISTANTS_DIR != ''
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: beget-ai-assistants
      url: https://scout-argument.ru/ai-assistants/
    steps:
      - uses: actions/checkout@v4
      - name: Upload ai-assistants page to Beget (FTP)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.BEGET_FTP_HOST }}
          username: ${{ secrets.BEGET_FTP_AI_USER || secrets.BEGET_FTP_USER }}
          password: ${{ secrets.BEGET_FTP_AI_PASSWORD || secrets.BEGET_FTP_PASSWORD }}
          protocol: ftp
          server-dir: ${{ vars.BEGET_AI_ASSISTANTS_DIR }}
          local-dir: ./pages/ai-assistants/
          exclude: |
            **/.DS_Store
