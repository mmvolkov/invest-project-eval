name: Tests & Deploy (GitHub Pages, Beget)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests (engine & templates)
        run: node --test tests/*.test.mjs

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Inject AI config (vars.AI_PROVIDER / AI_BASE_URL / AI_MODEL / AI_LABEL, secrets.AI_API_KEY)
        env:
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}
          AI_BASE_URL: ${{ vars.AI_BASE_URL }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          AI_LABEL: ${{ vars.AI_LABEL }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
        run: node scripts/inject-ai-config.mjs
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4

  # Зеркало на собственном хостинге (Beget) по FTP (FTPS у Beget рвёт TLS на канале данных): scout-argument.ru/invest-project-eval/
  # Секреты репозитория: BEGET_FTP_HOST, BEGET_FTP_USER, BEGET_FTP_PASSWORD.
  # Переменная BEGET_FTP_DIR (необязательно): каталог на сервере, по умолчанию корень FTP-аккаунта.
  deploy-beget:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: beget
      url: https://scout-argument.ru/invest-project-eval/
    steps:
      - uses: actions/checkout@v4
      - name: Inject AI config
        env:
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}
          AI_BASE_URL: ${{ vars.AI_BASE_URL }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          AI_LABEL: ${{ vars.AI_LABEL }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
        run: node scripts/inject-ai-config.mjs
      # Зеркало на scout-argument.ru не должно индексироваться вместе с основным сайтом:
      # meta robots в index.html + заголовок X-Robots-Tag через .htaccess (только для копии на Beget).
      - name: Mark mirror as noindex
        run: |
          sed -i 's|<meta name="viewport"|<meta name="robots" content="noindex, nofollow, noarchive" />\n<meta name="viewport"|' index.html
          grep -q 'name="robots"' index.html
          printf '<IfModule mod_headers.c>\n  Header set X-Robots-Tag "noindex, nofollow, noarchive"\n</IfModule>\n' > .htaccess
      - name: Upload to Beget (FTP)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.BEGET_FTP_HOST }}
          username: ${{ secrets.BEGET_FTP_USER }}
          password: ${{ secrets.BEGET_FTP_PASSWORD }}
          protocol: ftp
          server-dir: ${{ vars.BEGET_FTP_DIR || './' }}
          local-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            node_modules/**
            tests/**
            scripts/**
            worker/**
            package.json
            README.md
            **/.DS_Store
